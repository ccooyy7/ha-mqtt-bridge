<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 840 245" role="img" aria-labelledby="title desc">
  <title id="title">HA MQTT Bridge architecture</title>
  <desc id="desc">Third-party systems exchange commands, responses and state with devices through an MQTT broker, a Node-RED bridge and Home Assistant.</desc>
  <defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto-start-reverse"><path d="M0 0L5 2.5L0 5" fill="none" stroke="#829c91"/></marker></defs>
  <rect x="1" y="1" width="838" height="243" rx="6" fill="#f8fbfa" stroke="#d8e4e0"/>
  <text x="24" y="30" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#5e7a70">HOW IT CONNECTS</text>
  <g transform="translate(20 32)">
    <g fill="none" stroke="#829c91" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"><path d="M137 71h26"/><path d="M293 71h26"/><path d="M476 71h26"/><path d="M644 71h26"/></g>
    <g font-family="Arial,sans-serif" text-anchor="middle">
      <rect x="6" y="32" width="129" height="79" rx="5" fill="#fff" stroke="#c9d5d0"/><text x="70" y="66" font-size="13" font-weight="600" fill="#354c40">Third-party</text><text x="70" y="86" font-size="11" fill="#6c7f74">Control platform</text>
      <rect x="165" y="32" width="126" height="79" rx="5" fill="#e9f5ef" stroke="#a8d6be"/><text x="228" y="66" font-size="14" font-weight="600" fill="#176e4a">MQTT Broker</text><text x="228" y="86" font-size="11" fill="#60826b">Publish / Subscribe</text>
      <rect x="321" y="23" width="153" height="97" rx="5" fill="#fff" stroke="#47a678" stroke-width="1.5"/><text x="397" y="55" font-size="13" font-weight="600" fill="#176e4a">HA MQTT Bridge</text><rect x="356" y="69" width="82" height="23" rx="3" fill="#a83d3d"/><text x="397" y="85" font-size="11" font-weight="600" fill="#fff">Node-RED</text>
      <rect x="504" y="32" width="138" height="79" rx="5" fill="#eaf5fc" stroke="#b4d7ed"/><text x="573" y="66" font-size="13" font-weight="600" fill="#246184">Home Assistant</text><text x="573" y="86" font-size="11" fill="#5d8198">Events / Services</text>
      <rect x="672" y="32" width="121" height="79" rx="5" fill="#fff" stroke="#c9d5d0"/><text x="733" y="66" font-size="14" font-weight="600" fill="#354c40">Devices</text><text x="733" y="86" font-size="10" fill="#6c7f74">Light / HVAC / Cover</text>
      <path d="M70 148h660" stroke="#c2d6ca" stroke-dasharray="4 4"/>
      <rect x="182" y="134" width="436" height="58" fill="#f8fbfa"/>
      <text x="400" y="151" font-size="11" fill="#5b7968">Commands &#8594; set</text>
      <text x="400" y="173" font-size="11" fill="#5b7968">Responses and state &#8592; ack / result / state</text>
    </g>
  </g>
</svg>
